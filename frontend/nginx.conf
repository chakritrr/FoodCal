server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React — รองรับ client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* ไปหา backend
    location /api {
        proxy_pass http://backend:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
