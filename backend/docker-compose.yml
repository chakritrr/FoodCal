version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodcal-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: foodcal
      MYSQL_USER: foodcal_user
      MYSQL_PASSWORD: foodcal_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
